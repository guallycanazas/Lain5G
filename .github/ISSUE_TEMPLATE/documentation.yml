name: Documentation issue
description: Report unclear, incorrect, or stale documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Document location
      placeholder: docs/installation.md or a URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is unclear, incorrect, or outdated.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: sanitized
    attributes:
      label: Data safety
      options:
        - label: This report contains no secrets, subscriber data, private RF information, or unreviewed logs.
          required: true
