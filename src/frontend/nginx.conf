events {}

http {
  include /etc/nginx/mime.types;

  upstream lain5g_backend {
    server backend:8000;
  }

  upstream lain5g_grafana {
    server grafana:3000;
  }

  upstream lain5g_loki {
    server loki:3100;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://lain5g_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3700s;
    }

    location /grafana/ {
      proxy_pass http://lain5g_grafana;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /grafana;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 300s;
    }

    location = /loki/ready {
      proxy_pass http://lain5g_loki/ready;
      proxy_set_header Host $host;
      proxy_read_timeout 5s;
    }

    location = /alloy/ready {
      resolver 127.0.0.11 valid=5s ipv6=off;
      set $alloy_endpoint alloy:12345;
      proxy_pass http://$alloy_endpoint/-/ready;
      proxy_set_header Host alloy;
      proxy_connect_timeout 2s;
      proxy_read_timeout 3s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
