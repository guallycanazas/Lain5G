name: lain5g-lab-app

# Host ports are intentionally fixed to loopback. Docker control and a writable
# project mount are available only through docker-compose.app-operations.yml.

services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: lain5g-lab-app-backend
    working_dir: ${LAIN5G_PROJECT_ROOT:?Set LAIN5G_PROJECT_ROOT in .env.app}
    environment:
      LAIN5G_PROJECT_ROOT: ${LAIN5G_PROJECT_ROOT:?Set LAIN5G_PROJECT_ROOT in .env.app}
      LAIN5G_SCENARIO: ${LAIN5G_SCENARIO:-5g-sa}
      LAIN5G_DRY_RUN: ${LAIN5G_DRY_RUN:-false}
      LAIN5G_MUTATING_OPERATIONS_ENABLED: ${LAIN5G_MUTATING_OPERATIONS_ENABLED:-false}
      LAIN5G_COMMAND_TIMEOUT: ${LAIN5G_COMMAND_TIMEOUT:-300}
      LAIN5G_IMAGE_PULL_TIMEOUT: ${LAIN5G_IMAGE_PULL_TIMEOUT:-3600}
      LAIN5G_IMAGE_PULL_ENABLED: ${LAIN5G_IMAGE_PULL_ENABLED:-false}
      LAIN5G_LOG_TAIL_LINES: ${LAIN5G_LOG_TAIL_LINES:-500}
      LAIN5G_MAX_OUTPUT_CHARS: ${LAIN5G_MAX_OUTPUT_CHARS:-20000}
      LAIN5G_CORS_ORIGINS: ${LAIN5G_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      LAIN5G_OPEN5GS_MONGO_URI: ${LAIN5G_OPEN5GS_MONGO_URI:-mongodb://mongo:27017/open5gs}
      LAIN5G_OPEN5GS_MONGO_DATABASE: ${LAIN5G_OPEN5GS_MONGO_DATABASE:-open5gs}
      LAIN5G_OPEN5GS_SUBSCRIBER_COLLECTION: ${LAIN5G_OPEN5GS_SUBSCRIBER_COLLECTION:-subscribers}
      LAIN5G_SUBSCRIBER_SECRETS_VISIBLE: ${LAIN5G_SUBSCRIBER_SECRETS_VISIBLE:-false}
      LAIN5G_SUBSCRIBER_OPERATION_TIMEOUT: ${LAIN5G_SUBSCRIBER_OPERATION_TIMEOUT:-15}
      LAIN5G_OPEN5GS_DOCKER_NETWORK: ${LAIN5G_OPEN5GS_DOCKER_NETWORK:-lain5g-lab-5g-sa-x310-core}
      LAIN5G_OPEN5GS_DOCKER_IP: ${LAIN5G_OPEN5GS_DOCKER_IP:-10.20.0.250}
      LAIN5G_RF_WEB_CONTROL_ENABLED: ${LAIN5G_RF_WEB_CONTROL_ENABLED:-false}
      PYTHONPATH: ${LAIN5G_PROJECT_ROOT:?Set LAIN5G_PROJECT_ROOT in .env.app}/src
    volumes:
      - type: bind
        source: ${LAIN5G_PROJECT_ROOT:?Set LAIN5G_PROJECT_ROOT in .env.app}
        target: ${LAIN5G_PROJECT_ROOT:?Set LAIN5G_PROJECT_ROOT in .env.app}
        read_only: true
    ports:
      - "127.0.0.1:${APP_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - app

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: lain5g-lab-app-frontend
    depends_on:
      backend:
        condition: service_healthy
      grafana:
        condition: service_started
    ports:
      - "127.0.0.1:${APP_FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - app

  prometheus:
    image: prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    container_name: lain5g-lab-app-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - app

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    container_name: lain5g-lab-app-loki
    command:
      - -config.file=/etc/loki/config.yml
      - -target=all
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - app

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    container_name: lain5g-lab-app-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_METRICS_ENABLED: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    networks:
      - app

networks:
  app:
    name: lain5g-lab-app

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
